<html>
<meta charset=UTF-8>
<head>
    <title>Brasa Burguer</title>
    <link rel="stylesheet" href="../css/bar.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bogle&display=swap" rel="stylesheet">
</head>
<body>
<div class="imagem">
    <img src="../img/img1.jpg" alt="">
</div>
<h1>Brasa Burguer</h1>
<div class="botoes">
    <button onclick="window.location.href='menu.html'">Cardápio →</button>
    <button onclick="waiter()">Chamar atendente</button>
</div>

<canvas id="fogo"></canvas>

<script type="module">
    import { createBlaze } from "../js/blaze.js";

    const canvas = document.getElementById("fogo");

    // estilos aplicados via JS, sem mexer no seu CSS
    Object.assign(canvas.style, {
        position: "fixed",
        inset: "0",
        width: "100%",
        height: "100%",
        pointerEvents: "none", // não bloqueia os cliques nos botões
        zIndex: "10",
    });

    const blaze = createBlaze(canvas ? { output: canvas } : null, {
        layer: "foreground",
        height: 0.6,
        intensity: 0.8,
        sparks: 0.7,
        smoke: 0.4,
    });

    // para remover o efeito depois: blaze?.destroy();
</script>
<script>
    function waiter() {
        alert("Atendente chamado! Aguarde um momento.");
    }
</script>
<script src="../js/bar.js"></script>
</body>
</html>
